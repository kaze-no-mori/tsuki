<style>

body{color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;line-height:1.95;letter-spacing:.03em;

.screen{display:none}.screen.on{display:block}
h1{font-size:2rem;font-weight:600;margin:24px 0 4px;color:var(--gold);letter-spacing:.2em}
h2{font-size:1.15rem;font-weight:600;color:var(--gold);margin:28px 0 6px}
.lead{color:var(--sky);margin:0 0 36px}
.btn{display:block;width:100%;margin:14px 0;padding:16px;font:inherit;font-size:1.05rem;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--gold);border-radius:999px;cursor:pointer}

.brand{margin-top:44px;color:var(--sky);font-size:.85rem}
.count{font-size:2.6rem;color:var(--gold);margin:18px 0 4px}
.deck{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:22px 0}
.back{aspect-ratio:2/3;display:grid;place-items:center;border:1px solid var(--gold);border-radius:8px;color:var(--gold);font-size:1.3rem;cursor:pointer;background:linear-gradient(160deg,#6c5cb0,#3b5391);padding:0;font-family:inherit}
.back:focus-visible{outline:2px solid var(--sky)}
.back.pick{background:var(--gold);color:#2b2560;transform:translateY(-6px);transition:transform .35s}
.frame{margin:18px auto 8px;width:78%;max-width:320px;aspect-ratio:2/3;border:1px solid var(--gold);border-radius:10px;overflow:hidden;background:#3b3475;display:grid;place-items:center;font-size:3rem;color:var(--gold)}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.no{font-size:1.5rem;color:var(--gold);margin:14px 0 0}
.memo{color:var(--sky);font-size:.9rem;margin:2px 0 18px}
.box{text-align:left;margin:16px 0;padding:14px 16px;border-left:2px solid var(--gold);background:rgba(255,255,255,.05)}
.box b{display:block;color:var(--gold);font-weight:600;font-size:.95rem}
.cmp{border-left-color:var(--sky)}.cmp b{color:var(--sky)}
select{font:inherit;color:#2b2560;background:#fff;border:0;border-radius:8px;padding:8px;max-width:100%}
.note{color:#d9d2f0;font-size:.8rem;margin-top:26px}
@media (prefers-reduced-motion:reduce){.back.pick{transition:none}}
</style>
</head>
<body>
<main>
<section class="screen on" id="home">
  <h1>新月と満月の1枚</h1>
  <p class="lead">新月に1枚。満月に、もう1枚。<br>毎月の月に合わせて、また引けます。</p>
  <button class="btn gold" data-start="new">● 新月の1枚を引く</button>
  <button class="btn" data-start="full">○ 満月の1枚を引く</button>
  <p class="brand">風の杜_muneko</p>
</section>

<section class="screen" id="breath">
  <h2 id="bTitle"></h2>
  <p>深呼吸を3回。<br>吸って、吐いて。ゆっくりで大丈夫です。</p>
  <div class="count" id="bCount">0 / 3</div>
  <button class="btn gold" id="bBtn">吸って、吐いた</button>
</section>

<section class="screen" id="pick">
  <h2>直感で、1枚えらんでください</h2>
  <p class="lead" style="margin-bottom:0">目に留まった1枚を、そっとタップ。</p>
  <div class="deck" id="deck"></div>
</section>

<section class="screen" id="result"></section>
</main>

<script>
// 22枚のカード文章。e=絵柄, n=新月の読み, f=満月の読み, a=小さな行動
// 添え字がそのままカード番号(ライダー版の並び)。画像は images/00.jpg 〜 images/21.jpg
const CARDS = [
{e:"白い鳩と花畑で、両手を広げて笑う金髪の少年。",m:"既存の枠にとらわれない旅の始まりや、予測できない未来への一歩。",n:"まだ形のない「やってみたい」を、そのまま書いてみる夜。計画はいりません。",f:"踏み出した一歩で、景色がどれだけ変わったかを眺めます。荷物が軽くなっていたら、それも大きな変化です。",a:"「やってみたいこと」を1行だけ書く。"},
{e:"光る星と魔法円の中央に、剣・杯・羽根ペンが集まり、天からの手が光の粒に触れています。",m:"創造のはじまりや、持っている力を形にする意志。",n:"今あるもので始められることを、1つ選ぶ夜。足りないものは数えません。",f:"手元の道具を、どれだけ使えたか振り返ります。使えていなかったものに気づけたら、それも収穫です。",a:"今持っているもので、できることを3つ書き出す。"},
{e:"三日月の冠を戴き、水辺で本を開く女性。足もとの水面に光が映ります。",m:"直感と内なる知恵、静かに待つこと。",n:"答えを急がず、心の奥の声を聞く夜。ふと浮かんだ感覚を、そのまま書き留めます。",f:"あの日の直感が、今どう見えるか確かめます。当たり外れより、自分の感覚に気づけたことが大切です。",a:"5分だけ、何もせずに静かに座る。"},
{e:"花冠と薔薇を手にした女性が、三日月と星々に囲まれて佇みます。",m:"豊かさや愛情、育み実らせる力。",n:"自分を満たすことから始める夜。ほしいものは何か、素直に書いてみます。",f:"自分を大切にできたか、振り返ります。満たされた感覚が少しでもあれば、それが実りです。",a:"好きな飲み物を、丁寧に淹れて味わう。"},
{e:"玉座に座る、白いひげと角のような冠の王。杖を手に、羊の頭の装飾に囲まれています。",m:"安定や責任、現実を築く意志とリーダーシップ。",n:"何を軸にするか、決めてみる夜。守りたい習慣やルールを1つ書きます。",f:"決めた軸を守れたか、確かめます。守れなかった日も責めず、続け方を見直すきっかけにします。",a:"毎日の小さなルールを1つ決める。"},
{e:"鹿の角の冠をつけた、樹々の中の人物が、跪く二人を導いています。祭壇には金の鍵が交差しています。",m:"信頼できる導きや、学び、受け継がれる教え。",n:"頼れる人や、学びたい教えを思い浮かべる夜。誰に聞いてみたいか、書いてみます。",f:"教わったことや、人から受け取ったものを振り返ります。伝えたい人が浮かんだら、それも大切に。",a:"尊敬する人に、短い連絡を1通送る。"},
{e:"光の中で手をつなぐ男女と、その上に花の顔を持つ存在。足もとには蛇と赤い実。",m:"心からの選択や、調和、深いつながり。",n:"何を選びたいか、心が惹かれるほうを書いてみる夜。",f:"選んだものに、今も心が向いているか確かめます。迷いがあったなら、それも大切な気づきです。",a:"迷っていることを、2つの選択肢として書き出す。"},
{e:"白い鎧の戦士が光をまとって浮かび、白と黒のスフィンクスを従えています。",m:"意志の力で進む前進や、目標に向かう勝利。",n:"進みたい方向を1つ決めてみる夜。バラバラな気持ちを、同じ向きにそろえます。",f:"進んだ距離を確かめます。思ったより進んでいなくても、方向がぶれなかったなら十分です。",a:"今日やることを1つだけ決めて、最初にやる。"},

{e:"木の枝に片足でつながれ、逆さに眠る人物。足もとに三日月と水面。",m:"視点の転換や、あえて待つこと、手放すことで見える景色。",s:"動けない、報われない待ち時間のつらさがあります。待つ日が長く感じても、その努力と忍耐は、いつか報われることでしょう。",n:"いつもと違う角度から、物事を眺めてみる夜。待つことも、ひとつの選択です。",f:"立ち止まったからこそ見えたことを、振り返ります。",a:"いつもと違う道か、違うやり方を1つ試す。"},
{e:"頭巾をかぶった骸骨のような姿が、ろうそくのそばで、光る小さな魂たちを導きます。",m:"終わりと再生、区切りのあとに始まる新しい流れ。",s:"終わりには、寂しさや喪失感がつきものです。再生のチャンスでもあります。本当の意味での大切なものを見つけましょう。",n:"区切りをつけたいことを、静かに見つめる夜。終わらせなくても、整理するだけで十分です。",f:"区切りがついたこと、まだ持っていたいことを、分けて眺めます。",a:"もう使っていない物を1つ手に取って、「ありがとう」と言って整理する。"},
{e:"翼を持つ天使が、二つの水差しから光の水を注ぎ、水面に星を結びます。",m:"調和と節度、無理のない流れで整えること。",n:"自分に合うペースを探してみる夜。心地よい加減を、書いてみます。",f:"無理なく続けられたことを、確かめます。",a:"無理なく続けられそうな分量を、1つ決める。"},
{e:"角と鎖飾りの女王のような姿の下に、鎖でつながれた男女。",m:"執着や思い込みに気づくこと、手放すきっかけ。",s:"逃れたくても逃れられない、あらがえない苦しさがあるかもしれません。苦しいと認めることが、最初の一歩です。深呼吸して。",n:"「つい繰り返してしまうこと」を、正直に書いてみる夜。責めずに眺めます。",f:"縛られていると思っていたものが、少しゆるんだか確かめます。",a:"つい繰り返してしまう習慣を1つ書き、その理由も添える。"},
{e:"雷に打たれ、崩れる塔と、そこから落ちていく二人。",m:"突然の変化と、思い込みの崩れ、その先にある解放。",s:"塔は、突然の大きな衝撃を表すカードです。足もとが崩れるような痛みや動揺があったなら、それは大げさではありません。再建に向けて慌てず自分を見直しましょう。",n:"「こうでなければ」という思い込みを、1つ書いてみる夜。",f:"崩れて、見通しがよくなったものはないか、眺めます。",a:"「当たり前」だと思っていたことを、1つ疑ってみる。"},

{e:"花冠の少女が輪の中で踊り、四隅を人・鷲・牛・獅子が見守ります。",m:"完成と調和、ひとつのサイクルの達成。",n:"これまでの歩みを、ひとつ認める夜。どこまで来たか、書いてみます。",f:"ひとつのサイクルの終わりに、自分へ「おつかれさま」を言います。",a:"今月やれたことを3つ書いて、自分にお礼を言う。"}

</script>
<script>
const NAMES=["愚者","魔術師","女教皇","女帝","皇帝","教皇","恋人","戦車","力","隠者","運命の輪","正義","吊るされた男","死神","節制","悪魔","塔","星","月","太陽","審判","世界"];
const KEY="kazenomori_tsuki_v1";
const $=s=>document.querySelector(s);
const pad=i=>String(i).padStart(2,"0");
let store={};
try{store=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const card=i=>CARDS[i]||{e:"",n:"文章を準備中です。",f:"文章を準備中です。",a:""};
const label={new:"新月の1枚",full:"満月の1枚"};
let mode="new",breaths=0;

function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));window.scrollTo(0,0)}

function start(m){
  mode=m;
  if(typeof store[m]==="number"){renderResult(store[m]);return}
  breaths=0;$("#bTitle").textContent=label[m];$("#bCount").textContent="0 / 3";$("#bBtn").textContent="吸って、吐いた";show("breath");
}
function redraw(){delete store[mode];if(mode==="new")delete store.full;save();start(mode)}

$("#bBtn").onclick=()=>{
  breaths++;$("#bCount").textContent=breaths+" / 3";
  if(breaths>=3)setTimeout(openDeck,500);
};
function openDeck(){
  const order=[...Array(22).keys()].sort(()=>Math.random()-.5);
  const d=$("#deck");d.innerHTML="";
  order.forEach(ci=>{
    const b=document.createElement("button");b.className="back";b.type="button";b.setAttribute("aria-label","伏せられた1枚");b.textContent="✦";
    b.onclick=()=>{b.classList.add("pick");store[mode]=ci;if(mode==="new")delete store.full;save();setTimeout(()=>renderResult(ci),600)};
    d.appendChild(b);
  });
  show("pick");
}

function cmpText(a,b){
  if(a===b)return "新月と同じ1枚が出ました。あなたの中で、このテーマが今も大切だという読み方ができます。まだ途中でも大丈夫です。";
  const lead="";
  const k=a+"-"+b;
  if(PAIRS[k])return lead+PAIRS[k];
  const d=b-a;
  if(d===1)return lead+"隣り合うカードへ進みました。物語が、静かに次の場面へ移った、という読み方ができます。";
  if(d===-1)return lead+"隣り合うカードへ戻りました。ひとつ前の場面を、ていねいに見直している、という読み方ができます。";
  if(d>=10)return lead+"数字が大きく進みました。気持ちが大きく動いた期間だった、という読み方ができます。どんな変化があったか、思い返してみてください。";
  if(d<=-10)return lead+"数字が大きく戻りました。大切な原点に立ち返っている、という読み方ができます。後ろ向きではありません。";
  if(d>0)return lead+"数字が進んだので、物語が一歩先へ進んだ様子です。どんな変化があったか、思い返してみてください。";
  return lead+"数字が戻ったのは、一度立ち返って足場を確かめる時期、という読み方ができます。後ろ向きではありません。";
}

function renderResult(i){
  const c=card(i),r=$("#result");
  const isFull=mode==="full";
  let cmp="";
  if(isFull){
    if(typeof store.new==="number"){
      cmp='<div class="box cmp"><b>新月から満月へ</b>'+NAMES[store.new]+' → '+NAMES[i]+'<br>'+cmpText(store.new,i)+'</div>';
    }else{
      cmp='<div class="box cmp"><b>新月に引いた1枚があれば</b><select id="prev"><option value="">えらんでください</option>'+NAMES.map((n,k)=>'<option value="'+k+'">'+k+' '+n+'</option>').join("")+'</select></div>';
    }
  }
  r.innerHTML='<h2>'+label[mode]+'</h2>'
   +'<div class="frame" id="fr"><img src="'+pad(i)+'.jpg" alt="'+NAMES[i]+'" onerror="this.remove();document.getElementById(\'fr\').textContent=\'✦\'"></div>'
   +'<div class="no">'+i+'　'+NAMES[i]+'</div>'
   +'<div class="memo">あなたの1枚は '+i+'番 です。スクショか、メモに残してね。</div>'
   +'<div class="box"><b>絵柄</b>'+c.e+'</div>'
   +(c.m?'<div class="box"><b>カードの意味</b>'+c.m+'</div>':'')
   +'<div class="box"><b>'+(isFull?"満月の読み":"新月の読み")+'</b>'+(isFull?c.f:c.n)+'</div>'

   +(c.a?'<div class="box"><b>小さな行動</b>'+c.a+'</div>':'')
   +cmp
   +'<button class="btn sub" id="again">新しく引く</button><button class="btn sub" id="toHome">ホームへ</button>'
   +'<p class="note">占いは、自分の気持ちに気づくきっかけです。ゆるやかに受け取ってくださいね。</p>';
  $("#again").onclick=redraw;$("#toHome").onclick=()=>show("home");
  const p=$("#prev");
  if(p)p.onchange=()=>{if(p.value!==""){store.new=Number(p.value);save();renderResult(i)}};
  show("result");
}
